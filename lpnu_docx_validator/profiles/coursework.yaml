# ======================================================================
# Конфіг правил для валідатора оформлення DOCX
# ======================================================================
# Файл можна редагувати вручну або в GUI (вкладка «Налаштування»).
# Рядки, що починаються з #, — коментарі.
# Регулярні вирази записуйте в одинарних лапках '...'.
# Рівні серйозності: ERROR — помилка, WARNING — попередження,
#   INFO — інформація, OFF — вимкнути правило.

# ------------------------------------------------------------
# Профіль
# ------------------------------------------------------------
profile:
  # Назва профілю. Показується у списку профілів у GUI та у звіті.
  name: 'Курсова робота (типові вимоги)'

  # Опис профілю. Коротко: для чого цей профіль.
  description: 'Поля 2.5/1.5/2/2 см, Times New Roman 14, інтервал 1.5, номер сторінки зверху справа.'

# ------------------------------------------------------------
# Увімкнення груп перевірок (true/false)
# ------------------------------------------------------------
checks:
  # Сторінка й поля: Розмір аркуша, орієнтація та поля кожної Word-секції.
  page_setup: true
  # Нумерація сторінок: Поле PAGE у колонтитулах і старт нумерації зі змісту.
  page_numbering: true
  # Структура роботи: Обов'язкові частини, їхній порядок і автоматичний зміст.
  structure: true
  # Основний текст: Шрифт, розмір, відступ, інтервали та вирівнювання абзаців.
  paragraph_formatting: true
  # Порожні абзаци: Кілька Enter підряд замість інтервалів чи розриву сторінки.
  empty_paragraphs: true
  # Заголовки: Оформлення заголовків розділів і підрозділів.
  headings: true
  # Нумерація заголовків і об'єктів: Пропуски й невідповідності номерів підрозділів,
  # рисунків, таблиць.
  numbering: true
  # Рисунки, таблиці, підписи: Підписи до рисунків і таблиць та згадки про них у тексті.
  captions_and_references: true
  # Завершення підрозділів: Підрозділ не має закінчуватися рисунком/таблицею.
  section_endings: true
  # Формули: Номери формул і посилання на них.
  formulas: true
  # Таблиці: Розмір шрифту в таблицях.
  tables: true
  # Додатки: Літери додатків і згадки про них у тексті.
  appendices: true
  # Список джерел: Наявність і формальні ознаки бібліографічних описів.
  bibliography: true
  # Посилання на джерела: Посилання виду [1], [2–4], [1, с. 25] і їхня відповідність
  # списку.
  source_references: true
  # Типографіка: Подвійні пробіли, дефіс замість тире, лапки, латинські літери в
  # кириличних словах.
  typography: true
  # Залишки редагування: Невиконані виправлення, примітки, прихований і кольоровий текст.
  document_hygiene: true
  # Зображення: Ширина зображень і їхня роздільна здатність.
  images: true
  # Обсяг роботи: Кількість сторінок (потрібен LibreOffice).
  page_count: false

# ------------------------------------------------------------
# Параметри сторінки
# ------------------------------------------------------------
page:
  # Ширина аркуша, см. A4 = 21.0
  width_cm: 21.0

  # Висота аркуша, см. A4 = 29.7
  height_cm: 29.7

  # Ліве поле, см
  margin_left_cm: 2.5

  # Праве поле, см
  margin_right_cm: 1.5

  # Верхнє поле, см
  margin_top_cm: 2.0

  # Нижнє поле, см
  margin_bottom_cm: 2.0

  # Допустима похибка, см. Word зберігає розміри в інших одиницях, тому дрібні розбіжності
  # можливі.
  tolerance_cm: 0.08

  # Дозволяти окремі секції з альбомною орієнтацією. Для великих таблиць/схем. Поля таких
  # секцій не перевіряються.
  allow_landscape_sections: true

  # Не перевіряти першу Word-секцію (титулку). Титульна сторінка часто має інші поля.
  skip_first_word_section: true

# ------------------------------------------------------------
# Основний текст
# ------------------------------------------------------------
body_text:
  # Шрифт основного тексту
  font_name: 'Times New Roman'

  # Розмір шрифту, пт
  font_size_pt: 14.0

  # Абзацний відступ, см
  first_line_indent_cm: 1.25

  # Допустима похибка відступу, см
  indent_tolerance_cm: 0.08

  # Міжрядковий інтервал (множник). 1.0 — одинарний, 1.5 — півтора.
  line_spacing: 1.5

  # Вирівнювання основного тексту Можливі значення: LEFT, CENTER, RIGHT, JUSTIFY, ANY.
  alignment: 'JUSTIFY'

  # Інтервал перед абзацом, пт. Порожнє значення (null) — не перевіряти.
  space_before_pt: 0.0

  # Інтервал після абзацу, пт. Порожнє значення (null) — не перевіряти. У стилі
  # «Звичайний» нового Word стоїть 8 пт.
  space_after_pt: 0.0

  # Не перевіряти відступ і вирівнювання в пунктах списків. Пункти маркованих/нумерованих
  # списків Word часто мають власні відступи.
  skip_list_items: true

  # Моноширинні шрифти (лістинги коду). Абзаци, набрані цими шрифтами, вважаються кодом і
  # не перевіряються як основний текст.
  code_fonts:
    - 'Courier New'
    - 'Consolas'
    - 'Cascadia Code'
    - 'Cascadia Mono'
    - 'Lucida Console'
    - 'JetBrains Mono'
    - 'Source Code Pro'
    - 'DejaVu Sans Mono'
    - 'Menlo'
    - 'Monaco'

# ------------------------------------------------------------
# Нумерація сторінок
# ------------------------------------------------------------
page_numbering:
  # Де має бути номер сторінки. TOP — у верхньому колонтитулі, BOTTOM — у нижньому, ANY —
  # будь-де. Можливі значення: TOP, BOTTOM, ANY.
  position: 'TOP'

  # Вирівнювання номера сторінки Можливі значення: LEFT, CENTER, RIGHT, ANY.
  alignment: 'RIGHT'

  # Нумерація має починатися зі сторінки ЗМІСТ. Якщо вимкнено — перевіряється лише
  # наявність номера в секціях основної частини.
  start_from_toc: true

# ------------------------------------------------------------
# Структура роботи
# ------------------------------------------------------------
structure:
  # Як розпізнати заголовок змісту
  toc_heading_pattern: '(?i)^\s*зміст\s*$'

  # Звідки починається основна частина. Усе до першого такого заголовка вважається
  # титульною/службовою частиною.
  main_start_pattern: '(?i)^\s*(вступ|розділ\s+1\b.*)\s*$'

  # Обов'язкові частини роботи (по порядку). Кожен рядок — шаблон заголовка. Порядок у
  # списку = очікуваний порядок у роботі.
  required_sections:
    - '(?i)^\s*зміст\s*$'
    - '(?i)^\s*вступ\s*$'
    - '^\s*РОЗДІЛ\s+1\b'
    - '(?i)^\s*висновки\s*$'
    - '(?i)^\s*(список\s+використаних\s+джерел|перелік\s+використаних\s+джерел|список\s+використаної\s+літератури|список\s+літератури)\s*$'

  # Найглибший рівень заголовків у змісті. Заголовки глибших рівнів не мусять бути в
  # змісті.
  toc_max_level: 3

# ------------------------------------------------------------
# Заголовки
# ------------------------------------------------------------
headings:
  # Шаблон заголовка розділу. Група num — номер, dot — зайва крапка після номера.
  section_heading_pattern: '^\s*РОЗДІЛ\s+(?P<num>\d+)(?P<dot>\.)?\s+\S.+$'

  # Шаблон заголовка підрозділу
  numbered_heading_pattern: '^\s*(?P<num>\d+(?:\.\d+){1,5})(?P<dot>\.)?\s+\S.+$'

  # Шаблон структурних заголовків без номера
  intro_like_heading_pattern: '(?i)^\s*(зміст|вступ|висновки|висновок|список\s+використаних\s+джерел|перелік\s+використаних\s+джерел|список\s+використаної\s+літератури|список\s+літератури|перелік\s+умовних\s+позначень.*|додатки?|додаток\s+\S+.*)\s*$'

  # Вирівнювання заголовків розділів. ANY — не перевіряти. Можливі значення: LEFT, CENTER,
  # RIGHT, JUSTIFY, ANY.
  section_alignment: 'ANY'

  # Вирівнювання заголовків підрозділів. ANY — не перевіряти. Можливі значення: LEFT,
  # CENTER, RIGHT, JUSTIFY, ANY.
  subsection_alignment: 'ANY'

  # Максимальна довжина заголовка, символів. Довші абзаци з номером на початку не
  # вважаються заголовками.
  max_length: 160

# ------------------------------------------------------------
# Рисунки, таблиці, підписи
# ------------------------------------------------------------
captions:
  # Шаблон підпису рисунка. Дозволяє: «Рис. 1.1 — Назва», «Рис. 1.1. Назва», «Рисунок 1.1
  # — Назва», у додатках «Рис. А.1 — Назва».
  figure_caption_pattern: '^\s*(?:Рис\.|Рисунок)\s+(?P<num>(?:\d+|[А-ЯҐЄІЇA-Z])(?:\.\d+)*)\s*(?:[-–—.]\s*)\S.*$'

  # Шаблон підпису таблиці. Дозволяє: «Таблиця 1.1 — Назва», «Таблиця 1.1. Назва».
  table_caption_pattern: '^\s*Таблиця\s+(?P<num>(?:\d+|[А-ЯҐЄІЇA-Z])(?:\.\d+)*)\s*(?:[-–—.]\s*)\S.*$'

  # Шаблон згадки рисунка в тексті. Діапазони й переліки («рис. 1.1–1.3», «рисунки 2.1 і
  # 2.2») розбираються автоматично.
  figure_reference_pattern: '(?i)(?<!\w)(?:рисун\w*|рис\.)\s*(?P<num>\d+(?:\.\d+)*|[А-ЯҐЄІЇA-Z](?:\.\d+)+)'

  # Шаблон згадки таблиці в тексті
  table_reference_pattern: '(?i)(?<!\w)(?:таблиц\w*|табл\.)\s*(?P<num>\d+(?:\.\d+)*|[А-ЯҐЄІЇA-Z](?:\.\d+)+)'

  # Шаблон напису «Продовження таблиці». Перед частиною таблиці з таким написом підпис не
  # вимагається.
  table_continuation_pattern: '(?i)^\s*(продовження|закінчення)\s+(табл\.|таблиці)'

  # Дозволяти крапку в кінці підпису
  allow_trailing_dot: false

  # Вирівнювання підпису рисунка Можливі значення: LEFT, CENTER, RIGHT, JUSTIFY, ANY.
  figure_alignment: 'CENTER'

  # Вирівнювання підпису таблиці Можливі значення: LEFT, CENTER, RIGHT, JUSTIFY, ANY.
  table_alignment: 'RIGHT'

  # Дозволяти рисунок з підписом у таблиці без меж. Студенти часто ставлять рисунок і
  # підпис у таблицю для вирівнювання. Якщо увімкнено — це не вважається таблицею.
  figures_in_layout_tables: true

# ------------------------------------------------------------
# Формули
# ------------------------------------------------------------
formulas:
  # Шаблон номера формули. Номер праворуч у тому ж абзаці, що й формула: (2.1).
  number_pattern: '\(\s*(?P<num>\d+(?:\.\d+)*)\s*\)\s*$'

  # Шаблон згадки формули в тексті
  reference_pattern: '(?i)(?:формул\w*\s*\(?\s*|\()(?P<num>\d+\.\d+)\s*\)?'

# ------------------------------------------------------------
# Таблиці
# ------------------------------------------------------------
tables:
  # Дозволені розміри шрифту в таблицях, пт. По одному значенню на рядок.
  allowed_font_sizes_pt:
    - 12.0
    - 14.0

# ------------------------------------------------------------
# Додатки
# ------------------------------------------------------------
appendices:
  # Шаблон заголовка додатка
  heading_pattern: '^\s*ДОДАТОК\s+(?P<letter>[A-ZА-ЯҐЄІЇ])\b'

  # Літери, якими не можна позначати додатки. За ДСТУ 3008:2015: Ґ, Є, З, І, Ї, Й, О, Ч,
  # Ь.
  forbidden_letters: 'ҐЄЗІЇЙОЧЬ'

  # Шаблон згадки додатка в тексті
  reference_pattern: '(?i)(?<!\w)(?:додат\w*|дод\.)\s+(?P<letter>[A-ZА-ЯҐЄІЇ])(?!\w)'

# ------------------------------------------------------------
# Список джерел
# ------------------------------------------------------------
bibliography:
  # Як знайти заголовок списку джерел
  heading_pattern: '(?i)^\s*(список\s+використаних\s+джерел|перелік\s+використаних\s+джерел|список\s+використаної\s+літератури|список\s+літератури|література|references)\s*$'

  # Як починається джерело з номером, набраним вручну. Word-автонумерація обробляється
  # окремо.
  source_start_pattern: '^\s*(?:\[(?P<bracket>\d+)\]|(?P<plain>\d+)[\.)])\s+.+'

  # Ознака року
  year_pattern: '(?<!\d)(19\d{2}|20\d{2})(?!\d)'

  # Ознака електронного ресурсу
  url_pattern: '(?i)(https?://|www\.|doi:|\bDOI\b|\bURL\b|Режим\s+доступу)'

  # Ознака дати звернення
  access_date_pattern: '(?i)(дата\s+звернення|звернення\s*[:—-]|accessed|retrieved|дата\s+обращения)'

  # Ознака сторінок («С. 10–15»)
  pages_pattern: '(?<!\w)(?:С|C|с|c|P|p|pp|S|s)\.\s*\d+'

  # Ознаки статті/тез. Для таких джерел очікуються сторінки.
  article_markers_pattern: '(?i)(журнал|збірник|conference|конференц|вісник|proceedings|journal|тези|матеріали)'

  # Мінімальна довжина опису джерела, символів
  min_length: 25

# ------------------------------------------------------------
# Зображення
# ------------------------------------------------------------
images:
  # Мінімальна роздільна здатність зображення, DPI. Розраховується з розміру зображення в
  # пікселях і його розміру на сторінці.
  min_dpi: 150

# ------------------------------------------------------------
# Обсяг роботи
# ------------------------------------------------------------
page_count:
  # Мінімальна кількість сторінок
  min_pages: 35

  # Максимальна кількість сторінок
  max_pages: 50

# ------------------------------------------------------------
# Звіт
# ------------------------------------------------------------
report:
  # Скільки однакових повідомлень показувати. Решта згортається в рядок «… і ще N». 0 —
  # показувати всі.
  max_per_rule: 10

  # Показувати інформаційні повідомлення (INFO)
  show_info: true

  # Автор приміток у DOCX з коментарями
  comment_author: 'Валідатор оформлення'

# ------------------------------------------------------------
# Рівні серйозності окремих правил (ERROR / WARNING / INFO / OFF)
# ------------------------------------------------------------
severities:
  # --- Сторінка й поля ---
  page_setup: ERROR                           # Формат сторінки, орієнтація або поля
  # --- Нумерація сторінок ---
  page_number_missing: WARNING                # Немає номера сторінки
  page_number_alignment: ERROR                # Номер сторінки не там
  page_number_section_start: ERROR            # Нумерація починається не зі змісту
  page_number_first_page: WARNING             # Номер прихований на першій сторінці секції
  # --- Структура роботи ---
  structure_missing: ERROR                    # Немає обов'язкової частини
  structure_order: WARNING                    # Порушено порядок частин роботи
  structure_main_start: WARNING               # Не знайдено початок основної частини
  toc_manual: WARNING                         # Зміст набрано вручну
  toc_outdated: WARNING                       # Зміст не відповідає заголовкам
  # --- Основний текст ---
  paragraph_alignment: WARNING                # Вирівнювання абзацу
  paragraph_indent: WARNING                   # Абзацний відступ
  paragraph_line_spacing: WARNING             # Міжрядковий інтервал
  paragraph_spacing: WARNING                  # Інтервал перед/після абзацу
  paragraph_font: WARNING                     # Шрифт основного тексту
  paragraph_font_size: WARNING                # Розмір шрифту основного тексту
  # --- Порожні абзаци ---
  empty_paragraphs: WARNING                   # Кілька порожніх абзаців підряд
  # --- Заголовки ---
  heading_number_dot: ERROR                   # Крапка після номера розділу/підрозділу
  heading_trailing_dot: WARNING               # Крапка в кінці заголовка
  heading_section_case: WARNING               # Назва розділу не великими літерами
  heading_subsection_case: WARNING            # Регістр назви підрозділу
  heading_bold: WARNING                       # Заголовок розділу не напівжирний
  heading_alignment: WARNING                  # Вирівнювання заголовка
  section_new_page: WARNING                   # Розділ не з нової сторінки
  # --- Нумерація заголовків і об'єктів ---
  heading_numbering_sequence: WARNING         # Пропуск у нумерації підрозділів
  caption_numbering_sequence: WARNING         # Пропуск у нумерації рисунків/таблиць
  caption_chapter_mismatch: WARNING           # Номер рисунка/таблиці не відповідає розділу
  # --- Рисунки, таблиці, підписи ---
  caption_missing: ERROR                      # Немає підпису рисунка/таблиці
  caption_position: ERROR                     # Підпис не на своєму місці
  caption_alignment: ERROR                    # Вирівнювання підпису
  caption_duplicate: ERROR                    # Дубльований номер рисунка/таблиці
  caption_trailing_dot: WARNING               # Крапка в кінці підпису
  object_reference_missing: ERROR             # Немає згадки рисунка/таблиці до його появи
  # --- Завершення підрозділів ---
  section_empty: ERROR                        # Підрозділ без тексту
  section_ends_with_object: ERROR             # Підрозділ закінчується рисунком/таблицею
  # --- Формули ---
  formula_number_missing: WARNING             # Формула без номера
  formula_reference_missing: WARNING          # Немає згадки формули в тексті
  # --- Таблиці ---
  table_font_size: WARNING                    # Недозволений розмір шрифту в таблиці
  # --- Додатки ---
  appendix_invalid_letter: ERROR              # Недозволена літера додатка
  appendix_sequence: WARNING                  # Порушено послідовність літер додатків
  appendix_not_referenced: WARNING            # Немає згадки додатка в тексті
  # --- Список джерел ---
  bibliography_missing: ERROR                 # Немає списку джерел
  bibliography_empty: ERROR                   # Список джерел порожній
  source_number_missing: ERROR                # Джерело без номера
  source_sequence: WARNING                    # Порушено нумерацію джерел
  source_bare_url: ERROR                      # Джерело — голе посилання без опису
  source_too_short: WARNING                   # Надто короткий опис джерела
  source_missing_year: WARNING                # Немає року видання
  source_missing_access_date: WARNING         # Немає дати звернення до електронного ресурсу
  source_missing_url: WARNING                 # «URL/Режим доступу» без самого посилання
  source_article_pages: WARNING               # Немає сторінок статті («С. 10–15»)
  # --- Посилання на джерела ---
  source_refs_missing_all: ERROR              # У тексті немає жодного посилання на джерела
