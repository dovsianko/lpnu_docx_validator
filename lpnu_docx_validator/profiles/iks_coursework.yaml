# ======================================================================
# Конфіг правил для валідатора оформлення DOCX
# ======================================================================
# Файл можна редагувати вручну або в GUI (вкладка «Налаштування»).
# Рядки, що починаються з #, — коментарі.
# Регулярні вирази записуйте в одинарних лапках '...'.
# Рівні серйозності: ERROR — помилка, WARNING — попередження,
#   INFO — інформація, OFF — вимкнути правило.

extends: 'coursework'

# ------------------------------------------------------------
# Профіль
# ------------------------------------------------------------
profile:
  # Назва профілю. Показується у списку профілів у GUI та у звіті.
  name: 'Курсовий проект ІКС (методичка 2023)'

  # Опис профілю. Коротко: для чого цей профіль.
  description: 'За методичкою «Розробка хмарної обчислювальної мережі та захист корпоративних веб-застосунків» (Банах, Шабатура, 2023): поля зліва 20 мм, решта не менше 10 мм; абзац 1 см; TNR 14; розділи «1 НАЗВА» без слова РОЗДІЛ; «Рис. 3.5 — Назва»; джерела в порядку згадки; 35–50 сторінок.'

# ------------------------------------------------------------
# Увімкнення груп перевірок (true/false)
# ------------------------------------------------------------
checks:
  # Обсяг роботи: Кількість сторінок (потрібен LibreOffice).
  page_count: true

# ------------------------------------------------------------
# Параметри сторінки
# ------------------------------------------------------------
page:
  # Ліве поле, см
  margin_left_cm: 2.0

  # Праве поле, см
  margin_right_cm: 1.0

  # Верхнє поле, см
  margin_top_cm: 1.0

  # Нижнє поле, см
  margin_bottom_cm: 1.0

  # Як порівнювати поля. EXACT — поле має дорівнювати значенню; AT_LEAST — бути не меншим
  # (методички часто пишуть «не менше 10 мм»). Можливі значення: EXACT, AT_LEAST.
  margin_check: 'AT_LEAST'

# ------------------------------------------------------------
# Основний текст
# ------------------------------------------------------------
body_text:
  # Абзацний відступ, см
  first_line_indent_cm: 1.0

# ------------------------------------------------------------
# Структура роботи
# ------------------------------------------------------------
structure:
  # Звідки починається основна частина. Усе до першого такого заголовка вважається
  # титульною/службовою частиною.
  main_start_pattern: '(?i)^\s*(анотація|вступ)\s*$'

  # Обов'язкові частини роботи (по порядку). Кожен рядок — шаблон заголовка. Порядок у
  # списку = очікуваний порядок у роботі.
  required_sections:
    - '(?i)^\s*зміст\s*$'
    - '(?i)^\s*анотація\s*$'
    - '(?i)^\s*вступ\s*$'
    - '(?#ОСНОВНА ТЕХНІЧНА ЧАСТИНА)(?i)^\s*основна\s*\(?\s*технічна\s*\)?\s*частина\s*\)?\s*$'
    - '(?#перший розділ «1 НАЗВА»)^\s*(?:РОЗДІЛ\s+)?1\.?\s+\S'
    - '(?i)^\s*висновки\s*$'
    - '(?i)^\s*список\s+використаних\s+джерел\s*$'
    - '(?i)^\s*додат(ки|ок\s+\S+.*)\s*$'

  # Чого не має бути у змісті. Наприклад, індивідуальне завдання, яке за методичкою не
  # вноситься у зміст.
  toc_forbidden_patterns:
    - '(?i)індивідуальне\s+завдання'

# ------------------------------------------------------------
# Заголовки
# ------------------------------------------------------------
headings:
  # Шаблон заголовка розділу. Група num — номер, dot — зайва крапка після номера.
  section_heading_pattern: '^\s*(?:РОЗДІЛ\s+)?(?P<num>\d{1,2})(?P<dot>\.)?\s+(?=[^a-zа-яіїєґ]*$)\S.*$'

# ------------------------------------------------------------
# Рисунки, таблиці, підписи
# ------------------------------------------------------------
captions:
  # Правильний вигляд підпису. Типово дозволено «Рис. 1.1 — Назва» і «Рис. 1.1. Назва».
  # Інакше — зауваження caption_format.
  format_pattern: '^\s*(?:Рис\.|Таблиця)\s+[^\s.]+(?:\.\d+)*\s+[–—-]\s+\S'

  # Вирівнювання підпису таблиці Можливі значення: LEFT, CENTER, RIGHT, JUSTIFY, ANY.
  table_alignment: 'ANY'

# ------------------------------------------------------------
# Список джерел
# ------------------------------------------------------------
bibliography:
  # Вимагати рік і для електронних ресурсів. Вимкніть, якщо методичка дозволяє описувати
  # сайт без року (лише назва й URL).
  online_requires_year: false

# ------------------------------------------------------------
# Рівні серйозності окремих правил (ERROR / WARNING / INFO / OFF)
# ------------------------------------------------------------
severities:
  # --- Список джерел ---
  source_missing_access_date: OFF             # Немає дати звернення до електронного ресурсу
  # --- Посилання на джерела ---
  source_ref_order: WARNING                   # Джерела не в порядку першої згадки
