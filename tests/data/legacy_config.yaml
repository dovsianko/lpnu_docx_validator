# ============================================================
# Конфіг правил для docx_format_validator.py
# ============================================================
# Цей файл можна редагувати під вимоги конкретної кафедри/дисципліни.
# Коментарі починаються з # і не впливають на роботу валідатора.
#
# Severity-рівні для повідомлень:
#   ERROR   — критична помилка оформлення;
#   WARNING — попередження, варто перевірити вручну;
#   INFO    — інформаційне повідомлення;
#   OFF     — повністю вимкнути конкретне правило.
#
# Значення alignment:
#   LEFT    — вирівнювання ліворуч;
#   CENTER  — по центру;
#   RIGHT   — праворуч;
#   JUSTIFY — по ширині.
#
# Регулярні вирази задаються в одинарних лапках '...', щоб YAML не сприймав
# символи \ як службові escape-послідовності.

# ------------------------------------------------------------
# 1. Глобальне вмикання/вимикання груп перевірок
# ------------------------------------------------------------
checks:
  # Перевірка розміру сторінки, орієнтації, полів документа.
  page_setup: true

  # Перевірка наявності й розміщення номерів сторінок у колонтитулах.
  page_numbering: true

  # Перевірка основного тексту: шрифт, розмір, відступ, інтервал, вирівнювання.
  paragraph_formatting: true

  # Пошук декількох порожніх абзаців підряд, якими часто роблять ручні відступи.
  empty_paragraphs: true

  # Перевірка оформлення заголовків розділів і підрозділів.
  headings: true

  # Перевірка підписів рисунків/таблиць і згадок у тексті до їх появи.
  captions_and_references: true

  # Перевірка, що підрозділ не закінчується рисунком, таблицею або підписом.
  section_endings: true

  # Перевірка списку використаних джерел як окремого структурного блоку.
  bibliography: true

  # Перевірка посилань на джерела в основному тексті: [1], [2–4], [1; 3].
  source_references: true

# ------------------------------------------------------------
# 2. Параметри сторінки
# ------------------------------------------------------------
page:
  # Очікуваний розмір аркуша A4 у сантиметрах.
  width_cm: 21.0
  height_cm: 29.7

  # Очікувані поля сторінки в сантиметрах.
  # Поки залишені поточні значення валідатора.
  # За методичкою для цього курсака можна буде змінити на:
  #   left 2.5, right 1.5, top 2.0, bottom 2.0.
  margin_left_cm: 2.5
  margin_right_cm: 1.5
  margin_top_cm: 2.0
  margin_bottom_cm: 2.0

  # Допустима похибка порівняння в сантиметрах.
  # Word зберігає розміри в інших одиницях, тому дрібні розбіжності можливі.
  tolerance_cm: 0.08

  # Якщо true, перша технічна Word-секція повністю пропускається в перевірці
  # параметрів сторінки. Це потрібно, щоб не валити титулку за іншими полями.
  skip_first_word_section: true

# ------------------------------------------------------------
# 3. Основний текст
# ------------------------------------------------------------
body_text:
  # Очікуваний шрифт основного тексту.
  font_name: Times New Roman

  # Очікуваний розмір шрифту основного тексту.
  font_size_pt: 14.0

  # Абзацний відступ першого рядка, см.
  first_line_indent_cm: 1.25

  # Міжрядковий інтервал.
  line_spacing: 1.5

  # Очікуване вирівнювання основного тексту.
  alignment: JUSTIFY

# ------------------------------------------------------------
# 4. Нумерація сторінок
# ------------------------------------------------------------
page_numbering:
  # Де саме має бути номер сторінки:
  #   TOP    — у верхньому колонтитулі;
  #   BOTTOM — у нижньому колонтитулі;
  #   ANY    — прийняти номер або зверху, або знизу.
  # За методичкою: зверху справа, тобто TOP + RIGHT.
  position: TOP

  # Очікуване горизонтальне вирівнювання номера сторінки:
  #   LEFT   — ліворуч;
  #   CENTER — по центру;
  #   RIGHT  — праворуч.
  # За методичкою: зверху справа, тобто TOP + RIGHT.
  alignment: RIGHT

# ------------------------------------------------------------
# 5. Рисунки, таблиці, підписи й посилання на них
# ------------------------------------------------------------
captions:
  # Шаблон підпису рисунка.
  # num — іменована група, з якої валідатор бере номер рисунка.
  # Поточний шаблон дозволяє:
  #   Рис. 1.1 — Назва
  #   Рис. 1.1. Назва
  #   Рисунок 1.1 — Назва
  figure_caption_pattern: '^\s*(?:Рис\.|Рисунок)\s+(?P<num>\d+(?:\.\d+)*)\s*(?:[-–—.]\s*)\S.+$'

  # Шаблон підпису таблиці.
  # Поточний шаблон дозволяє:
  #   Таблиця 1.1 — Назва
  #   Таблиця 1.1. Назва
  table_caption_pattern: '^\s*Таблиця\s+(?P<num>\d+(?:\.\d+)*)\s*(?:[-–—.]\s*)\S.+$'

  # Шаблон посилання на рисунок у тексті.
  # Валідатор шукає такі згадки до появи відповідного рисунка.
  # Приклади: рис. 2.1, рисунок 2.1, рисунку 2.1.
  figure_reference_pattern: '(?i)\b(?:рисунок|рисунку|рисунка|рисунком|рис\.)\s*(?P<num>\d+(?:\.\d+)*)\b'

  # Шаблон посилання на таблицю в тексті.
  # Приклади: таблиця 2.1, у таблиці 2.1, табл. 2.1.
  table_reference_pattern: '(?i)\b(?:таблиця|таблиці|таблицю|таблицею|табл\.)\s*(?P<num>\d+(?:\.\d+)*)\b'

  # Очікуване вирівнювання підпису рисунка.
  figure_alignment: CENTER

  # Очікуване вирівнювання підпису таблиці.
  table_alignment: RIGHT

# ------------------------------------------------------------
# 6. Заголовки
# ------------------------------------------------------------
headings:
  # Шаблон заголовка розділу.
  # dot — іменована група, яка дозволяє знайти зайву крапку після номера.
  # Методичний варіант без крапки: РОЗДІЛ 1 НАЗВА
  # Частий неправильний варіант: РОЗДІЛ 1. НАЗВА
  section_heading_pattern: '^\s*РОЗДІЛ\s+(?P<num>\d+)(?P<dot>\.)?\s+\S.+$'

  # Шаблон заголовка підрозділу/пункту.
  # Методичний варіант без крапки: 1.1 Назва
  # Частий неправильний варіант: 1.1. Назва
  numbered_heading_pattern: '^\s*(?P<num>\d+(?:\.\d+){1,5})(?P<dot>\.)?\s+\S.+$'

  # Окремі структурні заголовки без номерів.
  # Використовується для розпізнавання ВСТУП, ВИСНОВКИ, СПИСОК ДЖЕРЕЛ тощо.
  intro_like_heading_pattern: '(?i)^\s*(вступ|висновки|список\s+використаних\s+джерел|додатки?)\s*$'

# ------------------------------------------------------------
# 7. Список використаних джерел
# ------------------------------------------------------------
bibliography:
  # Як валідатор знаходить початок списку літератури.
  heading_pattern: '(?i)^\s*(список\s+використаних\s+джерел|перелік\s+використаних\s+джерел|список\s+літератури|література|references)\s*$'

  # Як має починатися окреме джерело, якщо номер прописаний текстом.
  # Підтримує: [1] Джерело..., 1. Джерело..., 1) Джерело...
  # Word-автонумерація також частково обробляється кодом окремо.
  source_start_pattern: '^\s*(?:\[(?P<bracket>\d+)\]|(?P<plain>\d+)[\.)])\s+.+'

  # Ознака року у джерелі.
  year_pattern: '\b(19\d{2}|20\d{2})\b'

  # Ознаки електронного ресурсу або вебджерела.
  url_pattern: '(?i)\b(https?://|www\.|doi:|DOI\b|URL\b|Режим\s+доступу)'

  # Ознаки дати звернення для вебджерела.
  access_date_pattern: '(?i)(дата\s+звернення|звернення\s*[:—-]|accessed|retrieved|дата\s+обращения)'

# ------------------------------------------------------------
# 8. Рівні серйозності окремих правил
# ------------------------------------------------------------
severities:
  # --- сторінка й поля ---
  page_setup: ERROR                  # неправильний формат сторінки, орієнтація або поля

  # --- нумерація сторінок ---
  page_number_missing: WARNING       # не знайдено номер сторінки в колонтитулі
  page_number_alignment: ERROR       # номер сторінки є, але не там, де очікується
  page_number_section_start: ERROR   # нумерація починається не з потрібної Word-секції

  # --- основний текст ---
  paragraph_alignment: WARNING       # абзац основного тексту не вирівняний по ширині
  paragraph_indent: WARNING          # неправильний або відсутній абзацний відступ
  paragraph_line_spacing: WARNING    # неправильний міжрядковий інтервал
  paragraph_font: WARNING            # явно заданий неправильний шрифт
  paragraph_font_size: WARNING       # явно заданий неправильний розмір шрифту
  empty_paragraphs: WARNING          # кілька порожніх абзаців підряд

  # --- рисунки, таблиці, підписи, згадки ---
  caption_missing: ERROR             # біля рисунка/таблиці не знайдено підпис
  caption_position: ERROR            # підпис не там: рисунок має підпис знизу, таблиця зверху
  caption_alignment: ERROR           # неправильне вирівнювання підпису
  caption_duplicate: ERROR           # дублюється номер рисунка/таблиці
  object_reference_missing: ERROR    # немає згадки рисунка/таблиці в тексті до появи

  # --- заголовки ---
  heading_number_dot: ERROR          # зайва крапка після номера розділу/підрозділу
  heading_section_case: WARNING      # заголовок розділу не у верхньому регістрі
  heading_bold: WARNING              # заголовок не виглядає напівжирним, якщо це вдалось визначити
  heading_subsection_case: WARNING   # підрозділ не схожий на 'з великої літери, далі малі'

  # --- структура підрозділів ---
  section_empty: ERROR               # розділ/підрозділ без змістового тексту
  section_ends_with_object: ERROR    # підрозділ закінчується рисунком/таблицею/підписом

  # --- список джерел ---
  bibliography_missing: ERROR        # не знайдено список використаних джерел
  bibliography_empty: ERROR          # заголовок списку є, але джерел не розпізнано
  source_number_missing: ERROR       # джерело не починається з номера, якщо немає Word-нумерації
  source_sequence: WARNING           # порушено послідовність номерів джерел
  source_bare_url: ERROR             # джерело є просто голим URL без опису
  source_too_short: WARNING          # джерело надто коротке для нормального опису
  source_missing_year: WARNING       # у джерелі не знайдено рік
  source_missing_access_date: WARNING # у вебджерелі не знайдено дату звернення
  source_missing_url: WARNING        # запис схожий на вебджерело, але URL не знайдено
  source_article_pages: WARNING      # запис схожий на статтю/тези, але не знайдено сторінки

  # --- посилання на джерела в тексті ---
  source_refs_missing_all: ERROR     # у тексті взагалі не знайдено посилань виду [1]
  source_ref_unknown_number: ERROR   # є посилання на номер, якого немає у списку джерел
  source_missing_in_text: ERROR      # джерело є у списку, але на нього немає посилання в тексті
  source_ref_suspicious: WARNING     # підозрілий формат посилання на джерело
