name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements_docx_validator.txt pytest ruff
      - run: ruff check lpnu_docx_validator tests
      - run: pytest -q
      - name: GUI у справжньому tkinter (xvfb)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb python3-tk
          xvfb-run -a python tests/gui_real_smoke.py

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements_docx_validator.txt tkinterdnd2 pyinstaller
      - name: Збірка .exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name DocxValidator `
            --add-data "lpnu_docx_validator/profiles;lpnu_docx_validator/profiles" `
            --collect-data docx --collect-all tkinterdnd2 packaging/launcher.py
          pyinstaller --noconfirm --onefile --console --name docx-validator-cli `
            --add-data "lpnu_docx_validator/profiles;lpnu_docx_validator/profiles" `
            --collect-data docx packaging/launcher.py
          Copy-Item docx_validator_config.yaml dist/
      - name: Перевірка .exe
        run: |
          dist/docx-validator-cli.exe --version
          dist/docx-validator-cli.exe list-profiles
      - uses: actions/upload-artifact@v4
        with:
          name: DocxValidator-windows
          path: dist/*
      - name: Реліз (для тегів v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DocxValidator.exe
            dist/docx-validator-cli.exe
            dist/docx_validator_config.yaml
